<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="description" content="A fast, focused workout set tracker." />
    <title>Rep — Workout Tracker</title>
    <style>
:root { font-family: Arial, Helvetica, sans-serif; color: #20231f; background: #e8ebe6; font-synthesis: none; }
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; min-height: 100vh; }
button, input { font: inherit; }
button { color: inherit; }
svg { width: 1.5rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.phone-shell { width: 100%; max-width: 520px; min-height: 100vh; margin: 0 auto; background: #f9faf7; overflow: hidden; }
.topbar { height: 78px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e7e9e3; }
.brand { border: 0; background: none; font: 800 14px/1 Arial, Helvetica, sans-serif; letter-spacing: .16em; display: flex; align-items: center; gap: 9px; cursor: pointer; }
.brand span { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; background: #20231f; color: #fff; font-size: 14px; letter-spacing: 0; }
.step { color: #8c9188; font-size: 10px; font-weight: 700; letter-spacing: .12em; }.step strong { margin-left: 8px; color: #20231f; }
.screen { padding: 26px 24px 44px; animation: enter .28s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.eyebrow { margin: 0 0 9px; color: #778176; font-size: 10px; font-weight: 800; letter-spacing: .18em; }
h1 { margin: 0; font: 800 39px/1.06 Arial, Helvetica, sans-serif; letter-spacing: -.045em; } h1 em { color: #8a9a87; font-style: normal; }
.subhead { margin: 14px 0 27px; color: #777c75; font-size: 14px; }
.area-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.area-card { position: relative; min-height: 158px; padding: 20px; border: 1px solid rgba(31,35,30,.05); border-radius: 22px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; overflow: hidden; cursor: pointer; transition: transform .18s, box-shadow .18s; }
.area-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(32,35,31,.08); }.area-card:active { transform: scale(.98); }
.area-card.wide { grid-column: span 2; min-height: 130px; flex-direction: row; align-items: center; }.area-card.wide .area-icon { margin: 0 8px 0 0; }.area-card.wide .area-label { margin-right: auto; }
.sage { background: #dfe8dd; }.blue { background: #dde8ea; }.peach { background: #f1e3d8; }.lilac { background: #e7e1ea; }.sand { background: #ebe7d8; }
.area-icon { margin-bottom: 22px; width: 49px; height: 49px; display: grid; place-items: center; border-radius: 16px; background: rgba(255,255,255,.65); }.area-icon svg { width: 34px; height: 34px; }
.area-label { font: 700 17px Arial, Helvetica, sans-serif; }.round-arrow { position: absolute; right: 17px; bottom: 17px; width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.7); }.round-arrow svg { width: 15px; }
.back { padding: 0; border: 0; background: none; display: flex; align-items: center; gap: 6px; color: #71766f; font-size: 12px; font-weight: 600; cursor: pointer; }.back svg { width: 17px; }
.section-heading { margin: 32px 0 27px; }
.exercise-list { display: grid; gap: 11px; }
.exercise-card { min-height: 91px; padding: 15px 17px; border: 1px solid #e2e5de; border-radius: 18px; background: #fff; display: grid; grid-template-columns: 45px 1fr 31px; align-items: center; gap: 13px; text-align: left; cursor: pointer; transition: border-color .18s, transform .18s; }.exercise-card:hover { border-color: #9aa995; transform: translateX(2px); }
.exercise-number { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 13px; background: #edf1e9; color: #71806e; font-size: 11px; font-weight: 800; letter-spacing: .05em; }.exercise-card strong { display: block; font: 700 15px Arial, Helvetica, sans-serif; }.exercise-card small { display: block; margin-top: 5px; color: #999e96; font-size: 10px; }.exercise-arrow { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #e5e7e1; border-radius: 50%; }.exercise-arrow svg { width: 14px; }
.tip { margin: 25px 0 0; color: #8b9088; font-size: 11px; text-align: center; }.tip span { margin-right: 7px; padding: 3px 6px; border-radius: 5px; background: #e7ece4; color: #647060; font-size: 8px; font-weight: 800; letter-spacing: .1em; }
.tracker-screen { padding-bottom: 35px; }.tracker-title { margin: 28px 0 23px; display: flex; justify-content: space-between; align-items: end; }.tracker-title h1 { max-width: 330px; font-size: 29px; }.set-count { width: 52px; height: 52px; display: grid; place-content: center; border-radius: 15px; background: #e5ebe1; color: #53604f; font: 800 19px/1 Arial, Helvetica, sans-serif; text-align: center; }.set-count small { display: block; margin-top: 4px; font: 800 7px/1 Arial, Helvetica, sans-serif; letter-spacing: .14em; }
.timer-card { margin-bottom: 13px; padding: 16px 17px; border-radius: 18px; background: #263228; color: #fff; display: grid; grid-template-columns: 43px auto 1fr; align-items: center; gap: 13px; animation: pulse-in .3s ease; } @keyframes pulse-in { 50% { transform: scale(1.015); } }
.timer-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: #a9bf9d; color: #263228; }.timer-icon svg { width: 22px; }.timer-card small { display: block; margin-bottom: 3px; color: #aeb9ac; font-size: 7px; font-weight: 800; letter-spacing: .16em; }.timer-card strong { font: 700 23px Arial, Helvetica, sans-serif; letter-spacing: .04em; }.timer-card p { margin: 0; color: #b9c2b8; font-size: 9px; line-height: 1.5; text-align: right; }
.weight-card { padding: 22px; border: 1px solid #e0e3dc; border-radius: 22px; background: #fff; box-shadow: 0 8px 30px rgba(35,39,33,.04); }.weight-card label { color: #858a82; font-size: 9px; font-weight: 800; letter-spacing: .17em; }.weight-input { margin: 9px 0 18px; display: flex; align-items: baseline; border-bottom: 1px solid #dfe2dc; }.weight-input input { min-width: 0; width: 100%; padding: 3px 0 8px; border: 0; outline: 0; background: transparent; color: #20231f; font: 800 48px Arial, Helvetica, sans-serif; letter-spacing: -.04em; }.weight-input input::placeholder { color: #d9dcd6; }.weight-input span { color: #8d928a; font-size: 12px; font-weight: 800; }.add-set { width: 100%; height: 51px; border: 0; border-radius: 15px; background: #20231f; color: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px; }.add-set:hover { background: #354034; }.add-set svg { width: 18px; }.shake { animation: shake .3s; } @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.set-history { margin-top: 25px; }.history-title { display: flex; align-items: center; justify-content: space-between; }.history-title h2 { margin: 0; font: 700 14px Arial, Helvetica, sans-serif; }.history-title span { color: #92978f; font-size: 9px; }.set-history ol { list-style: none; margin: 11px 0 0; padding: 0; display: grid; gap: 8px; }.set-history li { min-height: 51px; padding: 0 14px; border: 1px solid #e4e6e0; border-radius: 13px; background: #fff; display: grid; grid-template-columns: 29px 1fr auto 37px; align-items: center; gap: 8px; font-size: 11px; }.set-history li strong { font: 700 13px Arial, Helvetica, sans-serif; }.set-history li small { color: #81907d; font-size: 7px; font-weight: 800; text-align: right; letter-spacing: .1em; }.set-check { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: #e4ede0; color: #63725e; }.set-check svg { width: 14px; }.set-history .empty-set { display: block; padding: 17px; color: #a0a49d; font-size: 10px; text-align: center; }.finish { width: 100%; margin-top: 20px; padding: 12px; border: 0; background: none; color: #888e85; font-size: 11px; text-decoration: underline; cursor: pointer; }
@media (min-width: 700px) { body { padding: 32px 0; }.phone-shell { min-height: calc(100vh - 64px); border-radius: 32px; box-shadow: 0 25px 70px rgba(32,35,31,.14); }.screen { min-height: 760px; } }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
const areas = [
  { name: 'Shoulders', icon: 'shoulders', accent: 'sage' },
  { name: 'Chest', icon: 'chest', accent: 'blue' },
  { name: 'Biceps', icon: 'biceps', accent: 'peach' },
  { name: 'Triceps', icon: 'triceps', accent: 'lilac' },
  { name: 'Legs', icon: 'legs', accent: 'sand' },
];

const exercises = {
  Shoulders: ['Lateral Raises', 'Reverse Pec Deck'],
  Chest: ['Incline Bench', 'Chest Press', 'Pec Fly'],
  Biceps: ['Preacher Curl Bar', 'Preacher Curl Dumbbell'],
  Triceps: ['Tricep Pushdown', 'Overhead Extension'],
  Legs: ['Leg Press', 'Hack Squat', 'Leg Extension'],
};

const icons = {
  shoulders: '<svg viewBox="0 0 48 48"><path d="M17 15c-5 1-9 5-10 11m24-11c5 1 9 5 10 11M18 10c1 3 3 5 6 5s5-2 6-5M14 34v-9c0-5 4-9 10-9s10 4 10 9v9"/></svg>',
  chest: '<svg viewBox="0 0 48 48"><path d="M9 28c1-9 5-14 12-14 1 4 1 8 3 11 2-3 2-7 3-11 7 0 11 5 12 14M13 35c2-5 6-8 11-8s9 3 11 8"/></svg>',
  biceps: '<svg viewBox="0 0 48 48"><path d="M13 32c7 7 20 4 23-5 1-4-1-8-5-9-4-1-7 1-9 4l-3-4 3-6-6-3-5 11c-2 5-1 9 2 12Z"/></svg>',
  triceps: '<svg viewBox="0 0 48 48"><path d="M31 11c-4 2-7 6-7 11l-5-4-5 4 7 10c3 5 10 6 14 2 5-5 4-13-1-17m-10 5 3 6"/></svg>',
  legs: '<svg viewBox="0 0 48 48"><path d="M17 8c0 9 2 15 6 21l-4 11m12-32c0 10-2 16-6 22l4 10M18 20h12"/></svg>',
  arrow: '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
  timer: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
};

let state = { screen: 'home', area: null, exercise: null, sets: [], timerStart: null };
let timerInterval;

const app = document.querySelector('#app');

function shell(content, step = 1) {
  return `<main class="phone-shell">
    <header class="topbar">
      <button class="brand" data-home aria-label="Go home"><span>R</span> REP</button>
      <div class="step">TODAY <strong>${step}/3</strong></div>
    </header>
    ${content}
  </main>`;
}

function renderHome() {
  const cards = areas.map((area, index) => `
    <button class="area-card ${area.accent} ${index === 4 ? 'wide' : ''}" data-area="${area.name}">
      <span class="area-icon">${icons[area.icon]}</span>
      <span class="area-label">${area.name}</span>
      <span class="round-arrow">${icons.arrow}</span>
    </button>`).join('');
  app.innerHTML = shell(`<section class="screen home-screen">
    <p class="eyebrow">LET'S GET TO WORK</p>
    <h1>What are we<br><em>training</em> today?</h1>
    <p class="subhead">Pick a muscle group to get started.</p>
    <div class="area-grid">${cards}</div>
  </section>`);
}

function renderExercises() {
  const list = exercises[state.area].map((name, i) => `
    <button class="exercise-card" data-exercise="${name}">
      <span class="exercise-number">0${i + 1}</span>
      <span><strong>${name}</strong><small>Track your working sets</small></span>
      <span class="exercise-arrow">${icons.arrow}</span>
    </button>`).join('');
  app.innerHTML = shell(`<section class="screen">
    <button class="back" data-back>${icons.back} All muscle groups</button>
    <div class="section-heading"><p class="eyebrow">${state.area.toUpperCase()} DAY</p><h1>Choose your<br><em>exercise.</em></h1></div>
    <div class="exercise-list">${list}</div>
    <p class="tip"><span>TIP</span> Start with your heaviest movement.</p>
  </section>`, 2);
}

function elapsed() {
  if (!state.timerStart) return '00:00';
  const seconds = Math.floor((Date.now() - state.timerStart) / 1000);
  return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
}

function renderTracker() {
  clearInterval(timerInterval);
  const setRows = state.sets.length ? state.sets.map((weight, i) => `
    <li><span class="set-check">${icons.check}</span><span>Set ${i + 1}</span><strong>${weight} lb</strong><small>DONE</small></li>`).join('') : '<li class="empty-set">Your completed sets will appear here.</li>';
  app.innerHTML = shell(`<section class="screen tracker-screen">
    <button class="back" data-back>${icons.back} ${state.area}</button>
    <div class="tracker-title"><div><p class="eyebrow">NOW TRAINING</p><h1>${state.exercise}</h1></div><span class="set-count">${state.sets.length}<small>SETS</small></span></div>
    ${state.timerStart ? `<div class="timer-card"><span class="timer-icon">${icons.timer}</span><span><small>REST TIMER</small><strong id="timer">${elapsed()}</strong></span><p>Take a breath.<br>Go when you're ready.</p></div>` : ''}
    <form id="set-form" class="weight-card">
      <label for="weight">WEIGHT</label>
      <div class="weight-input"><input id="weight" name="weight" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" autofocus><span>LB</span></div>
      <button type="submit" class="add-set">${icons.check} Add set</button>
    </form>
    <div class="set-history"><div class="history-title"><h2>Today's sets</h2><span>${state.sets.length} completed</span></div><ol>${setRows}</ol></div>
    <button class="finish" data-home>Finish exercise</button>
  </section>`, 3);
  if (state.timerStart) timerInterval = setInterval(() => {
    const timer = document.querySelector('#timer');
    if (timer) timer.textContent = elapsed();
  }, 1000);
  document.querySelector('#weight')?.focus();
}

function render() {
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'exercises') renderExercises();
  else renderTracker();
}

app.addEventListener('click', (event) => {
  const area = event.target.closest('[data-area]');
  const exercise = event.target.closest('[data-exercise]');
  if (area) { state = { ...state, screen: 'exercises', area: area.dataset.area }; render(); }
  if (exercise) { state = { ...state, screen: 'tracker', exercise: exercise.dataset.exercise, sets: [], timerStart: null }; render(); }
  if (event.target.closest('[data-home]')) { state = { screen: 'home', area: null, exercise: null, sets: [], timerStart: null }; render(); }
  if (event.target.closest('[data-back]')) {
    state = state.screen === 'tracker' ? { ...state, screen: 'exercises', timerStart: null } : { ...state, screen: 'home' };
    render();
  }
});

app.addEventListener('submit', (event) => {
  if (event.target.id !== 'set-form') return;
  event.preventDefault();
  const input = event.target.elements.weight;
  const weight = Number(input.value);
  if (!input.value || weight <= 0) { input.focus(); input.classList.add('shake'); setTimeout(() => input.classList.remove('shake'), 350); return; }
  state.sets.push(Number.isInteger(weight) ? weight : weight.toFixed(1));
  state.timerStart = Date.now();
  renderTracker();
});

render();

    </script>
  </body>
</html>
