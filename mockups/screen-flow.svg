<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#e8ebe6"/><style>text{font-family:Arial,sans-serif;fill:#20231f}.h{font-weight:800;font-size:28px}.k{font-size:9px;font-weight:700;letter-spacing:2px;fill:#778176}.b{font-size:13px;font-weight:700}.s{font-size:9px;fill:#858a82}.phone{fill:#f9faf7;stroke:#d8dcd4;stroke-width:2}.card{stroke:#e0e3dc;stroke-width:1}</style>
<text x="60" y="54" class="h">REP — clean light workout flow</text><text x="60" y="78" class="s">Three taps from muscle group to a recorded set. Designed for fast, one-handed use.</text>
<!-- home --> <g transform="translate(55 110)"><rect class="phone" width="330" height="730" rx="28"/><text x="25" y="42" class="b">●  REP</text><text x="258" y="42" class="s">TODAY  1/3</text><line x1="0" x2="330" y1="65" y2="65" stroke="#e7e9e3"/><text x="25" y="100" class="k">LET'S GET TO WORK</text><text x="25" y="137" class="h">What are we</text><text x="25" y="168" class="h" fill="#8a9a87">training today?</text><text x="25" y="195" class="s">Pick a muscle group to get started.</text><g transform="translate(25 220)"><rect width="133" height="150" rx="18" fill="#dfe8dd"/><text x="16" y="127" class="b">Shoulders</text><rect x="147" width="133" height="150" rx="18" fill="#dde8ea"/><text x="163" y="127" class="b">Chest</text><rect y="164" width="133" height="150" rx="18" fill="#f1e3d8"/><text x="16" y="291" class="b">Biceps</text><rect x="147" y="164" width="133" height="150" rx="18" fill="#e7e1ea"/><text x="163" y="291" class="b">Triceps</text><rect y="328" width="280" height="105" rx="18" fill="#ebe7d8"/><text x="22" y="390" class="b">Legs</text></g></g>
<!-- exercise --> <g transform="translate(435 110)"><rect class="phone" width="330" height="730" rx="28"/><text x="25" y="42" class="b">●  REP</text><text x="258" y="42" class="s">TODAY  2/3</text><line x1="0" x2="330" y1="65" y2="65" stroke="#e7e9e3"/><text x="25" y="100" class="s">‹  All muscle groups</text><text x="25" y="145" class="k">CHEST DAY</text><text x="25" y="181" class="h">Choose your</text><text x="25" y="212" class="h" fill="#8a9a87">exercise.</text><g transform="translate(25 240)"><rect class="card" fill="white" width="280" height="82" rx="15"/><rect x="15" y="19" width="43" height="43" rx="12" fill="#edf1e9"/><text x="29" y="45" class="s">01</text><text x="75" y="37" class="b">Incline Bench</text><text x="75" y="55" class="s">Track your working sets</text><rect class="card" fill="white" y="94" width="280" height="82" rx="15"/><rect x="15" y="113" width="43" height="43" rx="12" fill="#edf1e9"/><text x="29" y="139" class="s">02</text><text x="75" y="131" class="b">Chest Press</text><text x="75" y="149" class="s">Track your working sets</text><rect class="card" fill="white" y="188" width="280" height="82" rx="15"/><rect x="15" y="207" width="43" height="43" rx="12" fill="#edf1e9"/><text x="29" y="233" class="s">03</text><text x="75" y="225" class="b">Pec Fly</text><text x="75" y="243" class="s">Track your working sets</text></g></g>
<!-- tracker --> <g transform="translate(815 110)"><rect class="phone" width="330" height="730" rx="28"/><text x="25" y="42" class="b">●  REP</text><text x="258" y="42" class="s">TODAY  3/3</text><line x1="0" x2="330" y1="65" y2="65" stroke="#e7e9e3"/><text x="25" y="100" class="s">‹  Chest</text><text x="25" y="142" class="k">NOW TRAINING</text><text x="25" y="177" class="h">Incline Bench</text><rect x="25" y="204" width="280" height="75" rx="16" fill="#263228"/><text x="48" y="229" font-size="8" font-weight="700" fill="#aeb9ac">REST TIMER</text><text x="48" y="258" font-size="23" font-weight="700" fill="white">01:12</text><text x="207" y="238" font-size="9" fill="#b9c2b8">Take a breath.</text><text x="207" y="253" font-size="9" fill="#b9c2b8">Go when ready.</text><rect x="25" y="293" width="280" height="186" rx="18" fill="white" class="card"/><text x="45" y="322" class="k">WEIGHT</text><text x="45" y="380" font-size="46" font-weight="800">0</text><text x="259" y="378" class="b">LB</text><line x1="45" x2="285" y1="393" y2="393" stroke="#dfe2dc"/><rect x="45" y="410" width="240" height="49" rx="14" fill="#20231f"/><text x="135" y="441" class="b" fill="white">✓  Add set</text><text x="25" y="520" class="b">Today's sets</text><text x="240" y="520" class="s">2 completed</text><rect x="25" y="536" width="280" height="51" rx="13" fill="white" class="card"/><text x="47" y="567" class="b" fill="#63725e">✓</text><text x="78" y="567" class="s">Set 1</text><text x="210" y="567" class="b">135 lb</text><rect x="25" y="597" width="280" height="51" rx="13" fill="white" class="card"/><text x="47" y="628" class="b" fill="#63725e">✓</text><text x="78" y="628" class="s">Set 2</text><text x="210" y="628" class="b">145 lb</text></g>
